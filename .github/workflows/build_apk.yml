name: Build NIZHAL APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: flutter create . --org com.nizhal --project-name nizhal

      - name: Fix old Dart syntax
        run: |
          sed -i 's/colorScheme: \.fromSeed(seedColor: Colors.deepPurple),/colorScheme: ColorScheme.fromSeed(seedColor: Colors.deepPurple),/' lib/main.dart
          sed -i 's/mainAxisAlignment: \.center,/mainAxisAlignment: MainAxisAlignment.center,/' lib/main.dart

      - name: Get packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nizhal-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
